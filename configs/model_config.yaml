# YIFE Model Configuration
# Reference settings for the published study and repository pipeline.
# The exact published results require the original research inputs.

global:
  seed: 42
  temporal_test_start_year: 2021
  tuning_cv_folds: 3
  model_selection_cv_folds: 5
  target_column: "success"
  figures_dir: "figures/"
  models_dir: "models/"
  logs_dir: "logs/"

feature_engineering:
  geo_clusters:
    SF_Bay_Area: ["San Francisco", "Palo Alto", "Mountain View", "Menlo Park", "Sunnyvale"]
    NYC: ["New York", "Brooklyn", "Manhattan"]
    International: []
    Other: []
  elite_university_rule: "top-20 university"
  faang_companies:
    - "Facebook"
    - "Meta"
    - "Amazon"
    - "Apple"
    - "Netflix"
    - "Google"
    - "Alphabet"

features:
  funding:
    - total_funding_usd
    - num_funding_rounds
    - seed_round_size
  team:
    - team_size
    - faang_experience
    - elite_edu
  technical_depth:
    - github_repo_count
    - github_commit_freq
  batch_context:
    - batch_year_encoded
    - batch_size
  industry:
    - industry_category
    - ai_flag
  geography:
    - geo_cluster
  network:
    - tier1_vc_investor

models:
  logistic_regression:
    C: [0.1, 1.0, 10.0]
    max_iter: 1000
    class_weight: "balanced"

  svm:
    C: [1.0, 10.0]
    kernel: ["rbf"]
    gamma: ["scale"]
    probability: true
    class_weight: "balanced"

  random_forest:
    n_estimators: [200, 300]
    max_depth: [8, 15]
    min_samples_split: [2, 5]
    class_weight: "balanced"

  xgboost:
    n_estimators: [300]
    max_depth: [4, 6]
    learning_rate: [0.05]
    subsample: [0.8]
    colsample_bytree: [0.8]
    scale_pos_weight: "derived_from_training_labels"
    eval_metric: "logloss"

  mlp:
    hidden_sizes: [[128, 64, 32]]
    learning_rate: [0.001]
    alpha: [0.0001]
    max_iter: [300]
    early_stopping: true

preprocessing:
  numeric_features:
    - total_funding_usd
    - num_funding_rounds
    - seed_round_size
    - team_size
    - faang_experience
    - elite_edu
    - github_repo_count
    - github_commit_freq
    - batch_year_encoded
    - batch_size
    - ai_flag
    - tier1_vc_investor
  categorical_features:
    - industry_category
    - geo_cluster
  numeric_imputation: "median, fitted on training data only"
  categorical_imputation: "most_frequent, fitted on training data only"
  categorical_encoding: "one-hot, handle_unknown=ignore"
  scaled_models: ["logistic_regression", "svm", "mlp"]
