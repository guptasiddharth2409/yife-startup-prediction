# YIFE Model Configuration
# All hyperparameters sourced from this file for reproducibility.
# Do NOT hardcode values in source files — always reference this config.

global:
  seed: 42
  test_size: 0.20
  cv_folds: 5
  target_column: "success_label"
  figures_dir: "figures/"
  models_dir: "models/"

feature_engineering:
  geo_clusters:
    SF_Bay_Area: ["San Francisco", "Palo Alto", "Mountain View", "Menlo Park", "Sunnyvale"]
    NYC: ["New York", "Brooklyn", "Manhattan"]
    Other_US: []  # catch-all for remaining US cities
    International: []  # non-US
  batch_season_map:
    S: 1   # Summer
    W: 0   # Winter
  elite_universities:
    - "Stanford"
    - "MIT"
    - "Harvard"
    - "Carnegie Mellon"
    - "UC Berkeley"
    - "Caltech"
    - "Oxford"
    - "Cambridge"
    - "IIT"
  faang_companies:
    - "Facebook"
    - "Meta"
    - "Apple"
    - "Amazon"
    - "Netflix"
    - "Google"
    - "Alphabet"
    - "Microsoft"
    - "OpenAI"
    - "DeepMind"

models:
  logistic_regression:
    C: 1.0
    max_iter: 1000
    solver: "lbfgs"
    class_weight: "balanced"
    random_state: 42

  svm:
    C: 1.0
    kernel: "rbf"
    gamma: "scale"
    probability: true
    class_weight: "balanced"
    random_state: 42

  random_forest:
    n_estimators: 300
    max_depth: 8
    min_samples_split: 5
    min_samples_leaf: 2
    class_weight: "balanced"
    random_state: 42
    n_jobs: -1

  xgboost:
    n_estimators: 400
    max_depth: 6
    learning_rate: 0.05
    subsample: 0.8
    colsample_bytree: 0.8
    scale_pos_weight: 2.5
    eval_metric: "auc"
    random_state: 42
    n_jobs: -1

  mlp:
    hidden_sizes: [256, 128, 64]
    dropout: 0.3
    learning_rate: 0.001
    batch_size: 64
    epochs: 100
    patience: 10   # early stopping
    weight_decay: 0.0001

preprocessing:
  numeric_features:
    - total_funding_usd
    - funding_round_count
    - seed_round_size
    - team_size
    - elite_education_score
    - github_repo_count
    - commit_frequency
    - batch_year
    - batch_size
  binary_features:
    - has_faang_experience
    - is_ai_ml
  categorical_features:
    - industry_category
    - geo_cluster
    - yc_batch_encoded
  scaler: "StandardScaler"  # applied to numeric_features only
