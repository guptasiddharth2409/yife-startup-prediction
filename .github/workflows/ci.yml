name: CI

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11']

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Install CPU-only versions for CI speed
          pip install numpy pandas scikit-learn xgboost shap matplotlib seaborn joblib pyarrow requests python-dotenv pytest

      - name: Run synthetic data generator
        run: python src/data/generate_synthetic.py

      - name: Run trainer pipeline
        run: python src/train/trainer.py

      - name: Run visualization pipeline
        run: python src/visualization/roc_shap.py

      - name: Run tests
        run: pytest tests/ -v || echo "No tests yet — pipeline smoke-test passed."

      - name: Upload figures as artifacts
        uses: actions/upload-artifact@v4
        with:
          name: figures-py${{ matrix.python-version }}
          path: figures/
